{{ define "main" -}}
<div class="container">
  <div class="td-content">
    <p class="lead mt-5"><h1>Page not found</h1></p>
    <p>Oops! This page doesn't exist. Were you looking for:</p>
    <ul id="error-sections">
      {{ $sections := slice "docs/mapper" "docs/starter" "docs/compatibility" }}
      {{ range $sections }}
      {{ with site.GetPage "section" . }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
      {{ end }}
    </ul>
  </div>
</div>
{{- end }}
