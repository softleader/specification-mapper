# Keep GitHub actions up to date
# See also: https://docs.github.com/en/code-security/supply-chain-security/keeping-your-actions-up-to-date-with-dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/mapper"
      - "/starter"
    schedule:
      interval: "weekly"
    ignore:
      # Spring Boot has its own bump lane (.github/workflows/bump-spring.yml),
      # which is pinned to the supported line. Leave it to that workflow.
      - dependency-name: "org.springframework.boot:*"
