# A GitHub action to bump Spring to the latest version.
name: Bump Spring

on:
  schedule:
    - cron: "0 0 * * *" # In UTC time, 8:00 In Taipei time
  workflow_dispatch:

jobs:
  current-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - id: get-current-version
        run: echo "version=$(make spring-boot-version)" >> "$GITHUB_OUTPUT"
    outputs:
      spring-boot: ${{ steps.get-current-version.outputs.version }}

  latest-version:
    runs-on: ubuntu-latest
    steps:
      - id: get-latest-version
        uses: shihyuho/go-spring-version@v1
        with:
          boot-version: "~3.x"
    outputs:
      spring-boot: ${{ steps.get-latest-version.outputs.spring-boot }}

  compare-version:
    runs-on: ubuntu-latest
    needs: [latest-version, current-version]
    steps:
      - id: semver-compare
        uses: madhead/semver-utils@latest
        with:
          version: ${{ needs.latest-version.outputs.spring-boot }}
          compare-to: ${{ needs.current-version.outputs.spring-boot }}
      # 依 Spring Boot 升級幅度決定 PR 的 conventional commit 類型: 中版號 (或主版號) 升級用 feat, 僅升小版號用 fix
      - name: Resolve commit type
        id: commit-type
        env:
          CURRENT: ${{ needs.current-version.outputs.spring-boot }}
          LATEST: ${{ needs.latest-version.outputs.spring-boot }}
        run: |
          # 去掉修訂號, 只比 major.minor
          if [ "${CURRENT%.*}" = "${LATEST%.*}" ]; then
            echo "type=fix" >> "$GITHUB_OUTPUT"
          else
            echo "type=feat" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      comparison-result: ${{ steps.semver-compare.outputs.comparison-result }}
      commit-type: ${{ steps.commit-type.outputs.type }}

  bump-spring:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs: [latest-version, current-version, compare-version]
    if: "${{ needs.compare-version.outputs.comparison-result == '>' }}"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Bump version
        run: make bump-spring-boot BOOT=${{ needs.latest-version.outputs.spring-boot }}
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "${{ needs.compare-version.outputs.commit-type }}: bump spring-boot from ${{ needs.current-version.outputs.spring-boot }} to ${{ needs.latest-version.outputs.spring-boot }}"
          title: "${{ needs.compare-version.outputs.commit-type }}: bump spring-boot from ${{ needs.current-version.outputs.spring-boot }} to ${{ needs.latest-version.outputs.spring-boot }}"
          committer: bot 👾 <bot-noreply@softleader.com.tw>
          author: bot 👾 <bot-noreply@softleader.com.tw>
          body: >-
            Bumps [spring-projects/spring-boot](https://github.com/spring-projects/spring-boot)
            from ${{ needs.current-version.outputs.spring-boot }} to ${{ needs.latest-version.outputs.spring-boot }}
          labels: "type: dependency-upgrade"
          branch: "bot/${{ github.ref_name }}/bump-boot-${{ needs.latest-version.outputs.spring-boot }}"
          delete-branch: true
      - name: Enable Auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: liskin/gh-workflow-keepalive@v1
