name: Commitlint
on:
  pull_request:
    branches: [jakarta]
    types: [opened, edited, synchronize, reopened]

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # squash_merge_commit_title=COMMIT_OR_PR_TITLE -> 多 commit PR 的 squash subject = PR 標題,
  # 即 release-please 解析的 conventional commit。wagoid 只 lint commits 不 lint 標題,故額外補這個 job。
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >
          echo "$PR_TITLE" |
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional
          commitlint --extends @commitlint/config-conventional
